name: Refresh prices DB (3×/jour, dédié)

# Sync DB price_usd / market_cap_usd / market_cap_rank pour 780 fiches.
# Indépendant du daily-orchestrator (qui peut fail à cause d'autres sub-jobs).
#
# RÉSOUT (audit 2026-05-12) : DB stale 24h+ → classement Bitcoin/NEAR
# tous deux rank=1, recherche admin/UI affichant données fantômes.
#
# Schedule : 3×/jour (8h, 14h, 20h UTC) — soft refresh, rank évolue peu.

# 07/10/2026 : lancé par l'horloge Vercel (lib/gardien.ts) ; l'horaire ci-dessous reste comme filet (doublon sans danger :
# rafraîchissement idempotent, groupe de concurrence).
on:
  schedule:
    - cron: "0 8,14,20 * * *" # filet de l'horloge Vercel
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-prices-db
  cancel-in-progress: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TICKETS_PRIVES: ${{ secrets.SENTINELLE_TOKEN != '' }}
    steps:
      - name: Trigger /api/cron/refresh-prices (retry tolérant)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          URL="https://www.cryptoreflex.fr/api/cron/refresh-prices"
          for attempt in 1 2 3; do
            echo "Attempt $attempt: GET $URL"
            HTTP=$(curl -sS \
              -H "Authorization: Bearer $CRON_SECRET" \
              --max-time 120 \
              -w "%{http_code}" \
              -o /tmp/body.json \
              "$URL" || echo "000")
            echo "HTTP $HTTP"
            cat /tmp/body.json | head -c 500
            echo
            if [ "$HTTP" = "200" ]; then
              # 08/10/2026 (lot fraîcheur A2, audit L3 c) : un 200 ne prouve pas que les prix ont été écrits. La route
              # répond 200 même quand des lignes échouent (« errors » dans le corps) : le robot passe alors au ROUGE,
              # sans nouvel essai (un nouvel essai referait tout le travail et les appels CoinGecko).
              ERRS=$(jq -r 'if (.errors|type) == "number" then .errors else "illisible" end' /tmp/body.json 2>/dev/null || echo "illisible")
              UPD=$(jq -r '.updated // "?"' /tmp/body.json 2>/dev/null || echo "?")
              PROC=$(jq -r '.processed // "?"' /tmp/body.json 2>/dev/null || echo "?")
              # « 0 erreur » ET au moins une fiche écrite (0 écrite = rien de prouvé, ex. base lue vide)
              # ET (reprise du 08/10, juré I7) au moins 95 % des fiches traitées réellement écrites : une page CoinGecko
              # sur deux ne doit plus laisser un run vert.
              # 10/10/2026 (lot Z3) : résumé chiffré du passage dans le run (sources, couverture, archive, durée).
              {
                echo "## Robot des fiches (R2)"
                echo ""
                jq -r '"| Mesure | Valeur |\n|---|---|\n| Fiches en base | \(.fiches // "?") |\n| Appariées à CoinMarketCap | \(.appariees // "?") |\n| Appariées écrites | \(.ecritesAppariees // "?") (\(.couverturePct // "?") %) |\n| Lots CoinMarketCap réussis | \(.lotsCmcOk // "?") sur \(.lotsCmcDemandes // "?") |\n| Écrites par CoinMarketCap | \(.coinmarketcap // "?") |\n| Écrites par le repli CoinGecko | \(.coingecko // "?") |\n| Écrites par DexScreener (adresse) | \(.dexscreener // "?") sur \(.dexCandidates // "?") candidates (\(.dexAppels // "?") appels) |\n| Sans source (masquées au-delà de 48 h) | \(.sansSource // "?") |\n| Lignes suspectes (variation > 60 %) | \(.suspectes // "?") |\n| Archive des cours | \(.archive // "?") (\(.archivePoints // 0) points) |\n| Colonnes étendues | \(.colonnesEtendues // "?") |\n| Erreurs | \(.errors // "?") |\n| Durée | \(.durationMs // "?") ms |"' /tmp/body.json 2>/dev/null || echo "résumé illisible"
              } >> "$GITHUB_STEP_SUMMARY"
              # Finitions Z3 (M5) : aucun lot CoinMarketCap réussi (clé absente ou tous les lots en échec) → ⚠️ dans le
              # résumé et avertissement du run ; le run reste vert si les cours ont bien été écrits (règle ci-dessous).
              ATTENTION=$(jq -r '.attention // false' /tmp/body.json 2>/dev/null || echo "false")
              if [ "$ATTENTION" = "true" ]; then
                RAISON=$(jq -r '.raison // "raison non lue"' /tmp/body.json 2>/dev/null || echo "raison non lue")
                echo "::warning::refresh-prices : $RAISON"
                echo "## ⚠️ $RAISON" >> "$GITHUB_STEP_SUMMARY"
              fi
              # 10/10/2026 (lot Z3) : processed = fiches appariées à CoinMarketCap, updated = appariées réellement écrites ;
              # rouge si une erreur ou si la couverture est sous 95 %. Passage sauté par le frein du mois (cours de moins
              # de 12 h gardés) : vert, sans écriture.
              SAUTE=$(jq -r '.saute // false' /tmp/body.json 2>/dev/null || echo "false")
              if [ "$SAUTE" = "true" ] || { [ "$ERRS" = "0" ] && [ "$UPD" != "?" ] && [ "$PROC" != "?" ] && [ "$UPD" -gt 0 ] 2>/dev/null \
                && [ $(( UPD * 100 )) -ge $(( PROC * 95 )) ] 2>/dev/null; }; then
                echo "✅ Success (updated=$UPD / processed=$PROC, errors=0, sauté par le frein : $SAUTE, attention : $ATTENTION)"
                exit 0
              fi
              echo "::error::refresh-prices : errors=$ERRS, updated=$UPD sur processed=$PROC (95 % exigés)"
              echo "## ❌ Prix de la base : $ERRS erreur(s) d'écriture ($UPD fiche(s) mise(s) à jour)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          echo "::error::refresh-prices fail after 3 retries"
          # 08/10/2026 (lot fraîcheur A, audit n° 4) : plus de sortie forcée en succès ici. Un vrai échec doit être ROUGE : avant, ce
          # robot sortait toujours en vert et la sentinelle ne pouvait jamais le voir en échec (le bandeau des cours, servi
          # par le cache KV, reste à jour, mais les prix des fiches en base, eux, ne bougent plus).
          echo "## ❌ Prix de la base non rafraîchis (3 essais, dernier code HTTP $HTTP)" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Reprise Z3 (I5) : une fiche dont le cours CoinMarketCap/DexScreener s'écarte de plus de 60 % de la référence (cours
      # en base de moins de 48 h, sinon médiane 7 j de l'archive) deux passages de suite n'est pas écrite ET ouvre un ticket
      # privé (migration de jeton suivie sur l'ancien identifiant, mauvais appariement…).
      - name: Tickets privés non configurés
        if: always() && env.TICKETS_PRIVES != 'true'
        run: |
          echo "Secret SENTINELLE_TOKEN absent : aucun ticket « cours suspects » (le résumé du run reste le signal)."

      - name: Ticket « cours suspects » (dépôt privé)
        if: always() && env.TICKETS_PRIVES == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.SENTINELLE_TOKEN }}
          script: |
            const fs = require("fs");
            let corpsR2 = {};
            try { corpsR2 = JSON.parse(fs.readFileSync("/tmp/body.json", "utf8")); } catch (e) { return; }
            const rep = Array.isArray(corpsR2.suspectesRepetees) ? corpsR2.suspectesRepetees : [];
            if (!rep.length) return;
            const depot = { owner: "Qlpha-png", repo: "cryptoreflex-sentinelle" };
            const date = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const corps = [
              `${rep.length} fiche(s) au cours suspect deux passages de suite (écart > 60 % : cours non écrit).`,
              ``,
              `**Run** : ${runUrl}`,
              `**Date** : ${date}`,
              ``,
              ...rep.slice(0, 40).map((s) => `- \`${s.id}\` : écart ${s.ecartPct} % (source ${s.source}) — vérifier l'identifiant de data/cmc-id-map.json ou l'adresse de contrat`),
              ``,
              `_Ticket créé par \`.github/workflows/refresh-prices-db.yml\` (lot Z3)._`,
            ].join("\n");
            const existants = await github.rest.issues.listForRepo({ ...depot, state: "open", labels: "cours-suspects", per_page: 50 });
            const deja = existants.data.find((i) => i.title.startsWith("[cours-suspects]"));
            if (deja) {
              await github.rest.issues.createComment({ ...depot, issue_number: deja.number, body: corps });
              return;
            }
            await github.rest.issues.create({ ...depot, title: `[cours-suspects] fiches au cours suspect - ${date}`, body: corps, labels: ["bug", "cours-suspects", "monitoring"] });
