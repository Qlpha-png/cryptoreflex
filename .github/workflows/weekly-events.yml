name: Weekly events refresh

# Cron tous les lundis à 6h UTC (avant l'ouverture des marchés FR).
# 07/10/2026 : lancé par l'horloge Vercel (lib/gardien.ts) ; l'horaire ci-dessous reste comme filet (doublon sans danger :
# commit seulement si l'agenda change, groupe de concurrence). Tickets dans le dépôt PRIVÉ Qlpha-png/cryptoreflex-sentinelle.
# 08/10/2026 (lot fraîcheur A, reprise, juré I7) : LANCEMENT MANUEL SEULEMENT. Sans clé CoinMarketCal, ce robot sort en
# rouge chaque lundi (une issue par semaine) : un bruit qui banalise le rouge. Horaire GitHub et horloge Vercel coupés
# jusqu'à la décision de Kev sur CoinMarketCal ; il sort aussi de la liste CADENCE de la sentinelle.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TICKETS_PRIVES: ${{ secrets.SENTINELLE_TOKEN != '' }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      # 08/10/2026 (lot fraîcheur A, audit n° 34) : sans la clé (ou sans réponse de l'API), le script ÉCHOUE et le dit
      # dans le résumé du run ; avant, il sortait en vert sans rien faire.
      - name: Refresh events seed
        run: node scripts/refresh-events.mjs
        env:
          # API key CoinMarketCal (free tier 100 calls/jour) — OBLIGATOIRE : absente = run rouge.
          COINMARKETCAL_API_KEY: ${{ secrets.COINMARKETCAL_API_KEY }}

      # Bloquant avant tout commit : le bloc FOMC automatique doit rester intact et le projet doit compiler.
      - name: Tests du calendrier
        run: |
          npm ci --no-audit --no-fund
          npx vitest run tests/lib/events-fomc.test.ts
          npx tsc --noEmit -p .

      - name: Detect + commit changes (with rebase loop anti-race)
        run: |
          git add lib/events-seed.ts
          if ! git diff --staged --quiet; then
            git config user.name "Cryptoreflex Bot"
            git config user.email "bot@cryptoreflex.fr"
            git commit -m "chore(events): weekly refresh seed ($(date -u +%Y-%m-%d))" \
              -m "Generated by .github/workflows/weekly-events.yml" \
              -m "" \
              -m "Co-Authored-By: Cryptoreflex Bot <bot@cryptoreflex.fr>"

            # Anti-race-condition cf. daily-content.yml (race observee 2026-05-06).
            pushed=false
            for i in 1 2 3; do
              if git push origin main; then
                pushed=true
                break
              fi
              echo "Push rejete, rebase + retry (tentative $i / 3)..."
              git fetch origin main
              git rebase origin/main || { git rebase --abort; break; }
              sleep 2
            done
            if [ "$pushed" = "true" ]; then
              echo "## ✅ Events seed mis à jour" >> $GITHUB_STEP_SUMMARY
            else
              echo "## ❌ Push echoue apres 3 tentatives" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          else
            echo "## ℹ️ Aucun changement events" >> $GITHUB_STEP_SUMMARY
          fi

      # ----------------------------------------------------------------------
      # Notification d'échec (idem daily-content)
      # ----------------------------------------------------------------------
      - name: Tickets privés non configurés
        if: failure() && env.TICKETS_PRIVES != 'true'
        run: |
          echo "Secret SENTINELLE_TOKEN absent : aucun ticket ni commentaire (l'échec du job reste le signal)."

      - name: Notify on failure (dépôt privé)
        if: failure() && env.TICKETS_PRIVES == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.SENTINELLE_TOKEN }}
          script: |
            const depot = { owner: "Qlpha-png", repo: "cryptoreflex-sentinelle" };
            const date = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              ...depot,
              title: `[weekly-events] FAIL - ${date}`,
              body: [
                `Le workflow \`weekly-events\` a échoué.`,
                ``,
                `**Run** : ${runUrl}`,
                `**Date** : ${date}`,
                ``,
                `### Causes possibles`,
                `- Secret COINMARKETCAL_API_KEY absent (cas actuel : le run échoue volontairement, voir le résumé)`,
                `- API CoinMarketCal down ou quota dépassé (free tier 100 calls/jour)`,
                `- Tests du calendrier en échec (bloc FOMC effacé ou seed qui ne compile plus)`,
                `- Format de réponse API modifié`,
                `- Échec push sur main`,
                ``,
                `### À faire`,
                `1. Ouvrir le run et lire les logs`,
                `2. Re-run manuellement après investigation`,
                ``,
                `_Issue créée automatiquement par \`.github/workflows/weekly-events.yml\`_`,
              ].join("\n"),
              labels: ["bug", "auto-content"],
            });
