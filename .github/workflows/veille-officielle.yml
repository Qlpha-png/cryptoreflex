# Veille officielle — les sources dont dépendent les chiffres du site, relues chaque nuit (Kev, 05/10/2026 : « qu'ils se
# mettent à jour automatiquement sur les sources officielles, je n'ai pas envie d'avoir la moindre erreur »).
#
#  - Légifrance (API officielle PISTE, secrets PISTE_CLIENT_ID / PISTE_CLIENT_SECRET) : nouvelle version d'un article
#    suivi, version à venir déjà publiée, et chiffres attendus (305 €, 12,8 %, barème, décote, 10,6 %…) ;
#  - BOFiP (pages officielles + jeu de données ouvert), pages impots.gouv / service-public, registre MiCA de l'ESMA,
#    grilles de frais citées par le comparateur.
# Un changement : le job échoue (e-mail GitHub), le ticket « veille-officielle » est créé ou complété, et la routine
# Claude du matin relit la source, met le site à jour, puis relance ce workflow avec « enregistrer » (nouvelle référence
# data/veille/etat.json). Script : scripts/veille-officielle.mjs ; sources : data/veille/sources.json.
name: Veille officielle (lois, BOFiP, registres, frais)

# 07/10/2026 : lancée par l'horloge Vercel (lib/gardien.ts, sans aucune entrée : jamais « enregistrer ») ; l'horaire
# ci-dessous reste comme filet. Tickets dans le dépôt PRIVÉ Qlpha-png/cryptoreflex-sentinelle (secret SENTINELLE_TOKEN ;
# absent : aucun ticket, l'échec du job reste le signal). Un doublon est sans danger (lecture seule sans « enregistrer »,
# groupe de concurrence, ticket complété une fois par ensemble d'écarts).
on:
  schedule:
    - cron: "40 4 * * *" # 6 h 40 à Paris, avant le contrôle complet de la sentinelle (filet de l'horloge Vercel)
  workflow_dispatch:
    inputs:
      enregistrer:
        description: "Enregistrer l'état observé comme nouvelle référence (seulement après mise à jour du site)"
        type: boolean
        default: false
      detail:
        description: "Imprimer les extraits officiels (versions, phrases chiffrées)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: veille-officielle
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TICKETS_PRIVES: ${{ secrets.SENTINELLE_TOKEN != '' }}
      # entrées comparées au booléen ET au texte (un lancement par l'API peut envoyer "true"/"false" en texte : le texte
      # "false" ne doit JAMAIS valoir vrai)
      ENREGISTRER: ${{ inputs.enregistrer == true || inputs.enregistrer == 'true' }}
      DETAIL: ${{ inputs.detail == true || inputs.detail == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      # Navigateur réel pour les pages de frais rendues en JavaScript ou filtrées (option --navigateur)
      - name: Dépendances + Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Veille
        id: run
        continue-on-error: true
        env:
          PISTE_CLIENT_ID: ${{ secrets.PISTE_CLIENT_ID }}
          PISTE_CLIENT_SECRET: ${{ secrets.PISTE_CLIENT_SECRET }}
          VEILLE_REPORT: veille-report.md
        run: node scripts/veille-officielle.mjs --navigateur ${{ env.ENREGISTRER == 'true' && '--enregistrer' || '' }} ${{ env.DETAIL == 'true' && '--detail' || '' }}

      - name: Enregistrer la nouvelle référence
        # aussi quand des écarts de valeur restent : les versions relues sont enregistrées, l'écart reste signalé
        if: env.ENREGISTRER == 'true'
        run: |
          if [ -z "$(git status --porcelain -- data/veille/etat.json)" ]; then
            echo "Référence inchangée."
            exit 0
          fi
          git config user.name "Cryptoreflex Bot"
          git config user.email "bot@cryptoreflex.fr"
          git add data/veille/etat.json
          git commit -m "chore(veille): nouvelle référence des sources officielles" \
            -m "Généré par .github/workflows/veille-officielle.yml (option « enregistrer »)." \
            -m "" \
            -m "Co-Authored-By: Cryptoreflex Bot <bot@cryptoreflex.fr>"
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep 2
          done
          exit 1

      # 08/10/2026 (lot fraîcheur A, reprise, L6 MiCA) : chaque nuit où le registre de l'ESMA a été lu, les plateformes
      # SANS écart reçoivent la date du jour dans data/veille/mica-auto.json ; le site affiche alors « Registre ESMA
      # contrôlé automatiquement le JJ/MM/AAAA ». Une plateforme en écart garde sa date précédente (ticket ci-dessous).
      # Reprise Z1 : même étape pour data/veille/licences-ref.json (première référence d'une page de licence, écrite
      # automatiquement ; sans elle aucun ticket « relire la licence » ne peut s'ouvrir).
      - name: Publier la date du contrôle automatique du registre MiCA
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$(git status --porcelain -- data/veille/mica-auto.json data/veille/licences-ref.json)" ]; then
            echo "Date du contrôle MiCA et références de licence inchangées (registre illisible cette nuit, ou déjà publiées)."
            exit 0
          fi
          git config user.name "Cryptoreflex Bot"
          git config user.email "bot@cryptoreflex.fr"
          git add data/veille/mica-auto.json
          if [ -f data/veille/licences-ref.json ]; then git add data/veille/licences-ref.json; fi
          git commit -m "chore(veille): registre MiCA de l'ESMA contrôlé sans écart, références de licence" \
            -m "Généré par .github/workflows/veille-officielle.yml (data/veille/mica-auto.json, data/veille/licences-ref.json)." \
            -m "" \
            -m "Co-Authored-By: Cryptoreflex Bot <bot@cryptoreflex.fr>"
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep 2
          done
          exit 1

      - name: Tickets privés non configurés
        if: always() && env.TICKETS_PRIVES != 'true'
        run: |
          echo "Secret SENTINELLE_TOKEN absent : aucun ticket ni commentaire (l'échec du job reste le signal)."

      - name: Ticket « veille-officielle » (dépôt privé)
        if: always() && env.TICKETS_PRIVES == 'true'
        uses: actions/github-script@v9
        env:
          OUTCOME: ${{ steps.run.outcome }}
        with:
          github-token: ${{ secrets.SENTINELLE_TOKEN }}
          script: |
            const fs = require("fs");
            const depot = { owner: "Qlpha-png", repo: "cryptoreflex-sentinelle" };
            const report = fs.existsSync("veille-report.md") ? fs.readFileSync("veille-report.md", "utf8") : "(rapport absent)";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failed = process.env.OUTCOME === "failure";
            const defects = report.split("\n").filter((l) => l.startsWith("- ❌")).sort().join("\n");
            const { data: open } = await github.rest.issues.listForRepo({ ...depot, state: "open", labels: "veille-officielle", per_page: 10 });
            const issue = open[0];
            if (failed) {
              const body = `${report}\n\n[Voir l'exécution](${runUrl})`;
              if (!issue) {
                await github.rest.issues.create({ ...depot, title: "[Veille officielle] une source officielle a changé", body, labels: ["veille-officielle"] });
                return;
              }
              // une seule alerte par ensemble d'écarts identique (pas un commentaire par nuit)
              const { data: comments } = await github.rest.issues.listComments({ ...depot, issue_number: issue.number, per_page: 100 });
              const lastBody = comments.length ? comments[comments.length - 1].body : issue.body;
              const lastDefects = (lastBody || "").split("\n").filter((l) => l.startsWith("- ❌")).sort().join("\n");
              if (lastDefects !== defects) await github.rest.issues.createComment({ ...depot, issue_number: issue.number, body });
            } else if (issue) {
              await github.rest.issues.createComment({ ...depot, issue_number: issue.number, body: `✅ Plus aucun écart avec les sources officielles.\n\n${report}\n\n[Voir l'exécution](${runUrl})` });
              await github.rest.issues.update({ ...depot, issue_number: issue.number, state: "closed" });
            }

      # 08/10/2026 (lot Z1, architecture 0 € § 6.2 point 5) : empreinte mensuelle des pages de licence (S1 CoinMarketCap,
      # S2 DexScreener, S4 ESMA, S5 Licence ouverte, S7 alternative.me, S8 Fed). Une page dont les phrases de conditions
      # changent → un ticket « relire la licence » (titre stable : jamais deux tickets ouverts pour la même page). Fermé à
      # la main après relecture ; la référence avance avec « enregistrer ».
      - name: Tickets « relire la licence » (dépôt privé)
        if: always() && env.TICKETS_PRIVES == 'true' && hashFiles('veille-licences.json') != ''
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.SENTINELLE_TOKEN }}
          script: |
            const fs = require("fs");
            const depot = { owner: "Qlpha-png", repo: "cryptoreflex-sentinelle" };
            const changees = JSON.parse(fs.readFileSync("veille-licences.json", "utf8"));
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ouverts = await github.paginate(github.rest.issues.listForRepo, { ...depot, state: "open", labels: "licence", per_page: 100 });
            for (const c of changees) {
              const titre = `[Licence] relire la licence : ${c.cle} ${c.nom}`;
              if (ouverts.some((i) => i.title === titre)) continue;
              const liste = (xs) => (xs.length ? xs.map((x) => `- ${x}`).join("\n") : "- (aucune)");
              const corps = [
                `Les phrases de conditions de ${c.url} ont changé depuis le ${c.depuis ?? "dernier relevé"}.`,
                "",
                "Relire la page, vérifier que l'usage du site reste permis (usage commercial, attribution, redistribution), corriger si besoin, puis relancer la veille avec « enregistrer ».",
                "",
                "Phrases apparues :", liste(c.apparues), "", "Phrases disparues :", liste(c.disparues), "", `[Voir l'exécution](${runUrl})`,
              ].join("\n");
              await github.rest.issues.create({ ...depot, title: titre, body: corps, labels: ["licence"] });
            }

      - name: Échec si changement (e-mail GitHub)
        if: steps.run.outcome == 'failure'
        run: |
          echo "Une source officielle a changé : voir le ticket « veille-officielle »."
          exit 1
