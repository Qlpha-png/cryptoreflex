name: Refresh static-details KV (4×/jour, depuis GH IP)

# ÉCRIVAIN UNIQUE des détails des fiches (ATH, ATL, offre, mini-graphique 7 jours) depuis l'IP GitHub Actions — qui
# n'est PAS bannie par CoinGecko.
#
# 06/10/2026 (quota Upstash épuisé) : écrit 32 seaux `cg-static-details:v2:bNN` (~100 Ko, en cache côté site) en UNE
# commande MSET, relit les seaux (UNE commande MGET) seulement si un appel CoinGecko échoue, puis invalide l'étiquette
# `kv-static-details` du site. Le cron Vercel `refresh-static-details` et l'étape de l'orchestrateur (doublons) sont
# retirés : ce workflow est le seul écrivain.
#
# Schedule : 4×/jour = 06h, 12h, 18h, 00h UTC. Un seau de plus de 48 h est ignoré par le site (repli CoinGecko).
#
# Coût : ~120 runs/mois × ~30s = ~60 min/mois sous le free tier (illim. public).

# 07/10/2026 : lancé par l'horloge Vercel (lib/gardien.ts) ; l'horaire ci-dessous reste comme filet (doublon sans danger :
# réécriture idempotente des mêmes seaux, groupe de concurrence ; le passage le plus récent remplace celui en cours).
on:
  schedule:
    - cron: "0 */6 * * *" # filet de l'horloge Vercel
  workflow_dispatch:

# 10/10/2026 (lot Z3) : écriture du dépôt pour l'export des clôtures de l'archive des cours (data/archive/AAAA-MM.json).
permissions:
  contents: write

concurrency:
  group: refresh-static-details-kv
  cancel-in-progress: true

jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run populate-all-cryptos-kv
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          # Le script lit NEXT_PUBLIC_SUPABASE_URL mais on a SUPABASE_URL en
          # secret (existant pour d'autres workflows). Mapping direct.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Invalidation de l'étiquette kv-static-details sur le site après écriture.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          node scripts/populate-all-cryptos-kv.mjs

      # 10/10/2026 (lot Z3, R4) : copie de secours des clôtures de l'archive des cours (Supabase Free sans sauvegarde).
      # Le script n'écrit data/archive/AAAA-MM.json qu'au premier passage du 1er du mois (mois précédent) et du lundi (mois
      # en cours) ; sinon rien à commiter.
      - name: Commit de l'export de l'archive (avec reprise anti-course)
        run: |
          git add data/archive 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Archive des cours : rien à exporter à ce passage." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "Cryptoreflex Bot"
          git config user.email "bot@cryptoreflex.fr"
          git commit -m "chore(archive): clôtures de l'archive des cours ($(date -u +%Y-%m-%d))" \
            -m "Export de secours par .github/workflows/refresh-static-details-kv.yml (table cours_archive)" \
            -m "" \
            -m "Co-Authored-By: Cryptoreflex Bot <bot@cryptoreflex.fr>"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Archive des cours exportée (commit $(git rev-parse --short HEAD))." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push rejeté, rebase puis nouvel essai ($i / 3)…"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; break; }
            sleep 2
          done
          echo "## ❌ Export de l'archive des cours impossible après 3 essais" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Verify KV coverage
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Dépôt public = logs publics : on n'affiche QUE le code HTTP,
          # jamais le contenu du diagnostic. Le diagnostic ne lit plus que la clé meta (quelques octets).
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.cryptoreflex.fr/api/diag/api-usage")
          echo "api-usage HTTP $code"
