# Sentinelle — détection d'erreurs automatique de cryptoreflex.fr (Kev, 04/10/2026 : « une détection d'erreur fiable
# et automatisée pour te prévenir même quand je ne suis pas actif »).
#
#  - toutes les heures et après chaque déploiement de production : contrôle léger (pages clés, chiffres de l'accueil,
#    fraîcheur des actus et des prix, prix du Bitcoin contre Kraken, échecs des autres tâches GitHub) ;
#  - chaque nuit (après la publication des actus) : contrôle complet (+ moteur Cerfa 2086 sur l'exemple officiel du
#    BOFiP, liens partenaires, TOUTES les adresses des plans du site) et recomptage des chiffres du site
#    (data/site-counts.json, commité s'il a changé).
#
# Un défaut : le job échoue (GitHub envoie un e-mail), le ticket « Sentinelle » est créé ou complété (une seule fois
# par ensemble de défauts identique), et la routine Claude planifiée s'en charge. Retour au vert : ticket fermé.
# Script : scripts/sentinelle.mjs (aucun secret ni donnée personnelle dans le rapport).
#
# 07/10/2026 — dépôt PUBLIC = journaux publics : le rapport détaillé (défauts, réparations, chiffres d'infrastructure)
# ne va QUE dans les tickets du dépôt PRIVÉ Qlpha-png/cryptoreflex-sentinelle (secret SENTINELLE_TOKEN). Journal et
# résumé du job : un simple décompte. Secret absent : aucun ticket ni commentaire nulle part, l'échec du job reste le
# signal. Lancement : horloge Vercel (lib/gardien.ts, /api/cron/gardien/sentinelle-*) ; les horaires ci-dessous restent
# comme filet (GitHub en saute la plupart).
name: Sentinelle (détection d'erreurs)

on:
  schedule:
    - cron: "17 * * * *" # contrôle léger, toutes les heures (filet de l'horloge Vercel)
    - cron: "35 5 * * *" # contrôle complet, 7 h 35 à Paris (après le robot d'actus de 4 h 30 UTC ; filet de l'horloge Vercel)
  deployment_status:
  # 05/10/2026 : juste après chaque publication du jour (déclenchement fiable : les tâches programmées de GitHub prennent
  # souvent plusieurs heures de retard) — contrôle, puis réparation automatique si la publication a raté.
  workflow_run:
    workflows: ["Daily content generator (news + TA)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      full:
        description: "Contrôle complet (sinon léger)"
        type: boolean
        default: false

permissions:
  contents: write
  # write : relancer un robot (publication du jour, orchestrateur de secours, nouvelle tentative d'un robot en échec)
  actions: write

# 07/10/2026 : deux groupes (complet / léger). Avec un seul groupe, un passage léger arrivé pendant qu'un complet
# attendait son tour ANNULAIT le complet (GitHub ne garde qu'un passage en attente par groupe) ; l'horloge Vercel et le
# filet GitHub multiplient les lancements, donc ce cas devenait probable. Un doublon reste sans danger : recomptage
# commité seulement s'il change, ticket complété une fois par ensemble de défauts, réparations bornées (voir plus bas).
concurrency:
  group: sentinelle-${{ (github.event.schedule == '35 5 * * *' || inputs.full == true || inputs.full == 'true') && 'complet' || 'leger' }}
  cancel-in-progress: false

jobs:
  sentinelle:
    # après un déploiement : seulement les déploiements de production réussis (Vercel nomme l'environnement
    # « Production – cryptoreflex », d'où startsWith ; constaté le 05/10/2026)
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # l'horloge Vercel envoie full="true" (texte) : comparaison au booléen ET au texte
      FULL: ${{ github.event.schedule == '35 5 * * *' || inputs.full == true || inputs.full == 'true' }}
      # tickets privés seulement si le secret existe (jamais de ticket dans le dépôt public)
      TICKETS_PRIVES: ${{ secrets.SENTINELLE_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Laisser le déploiement se propager
        if: github.event_name == 'deployment_status'
        run: sleep 90

      - name: Dépendances (contrôle complet seulement)
        if: env.FULL == 'true'
        run: npm ci --no-audit --no-fund

      - name: Recompter les chiffres du site
        if: env.FULL == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/update-site-counts.mjs
          if git diff --quiet -- data/site-counts.json; then
            echo "Chiffres inchangés."
            exit 0
          fi
          git config user.name "Cryptoreflex Bot"
          git config user.email "bot@cryptoreflex.fr"
          git add data/site-counts.json
          git commit -m "chore(chiffres): recomptage automatique des chiffres du site" \
            -m "Généré par .github/workflows/sentinelle.yml (scripts/update-site-counts.mjs)." \
            -m "" \
            -m "Co-Authored-By: Cryptoreflex Bot <bot@cryptoreflex.fr>"
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep 2
          done
          exit 1

      - name: Contrôles
        id: run
        continue-on-error: true
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 07/10/2026 : lecture du budget CoinMarketCap (/api/diag/cmc-budget) ; jamais écrit dans le rapport
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # 08/10/2026 (lot Z1) : registre des 51 familles (dates en base) et taille de la base ; mêmes secrets que le
          # recomptage ci-dessus (aucun secret nouveau), jamais écrits dans le rapport
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # famille n° 43 : le recomptage a réussi dans ce passage (l'étape échoue et arrête le job sinon)
          RECOMPTAGE_OK: ${{ env.FULL }}
          SENTINELLE_REPORT: sentinelle-report.md
        run: node scripts/sentinelle.mjs ${{ env.FULL == 'true' && '--full' || '' }}

      - name: Tickets privés non configurés
        if: always() && env.TICKETS_PRIVES != 'true'
        run: |
          echo "Secret SENTINELLE_TOKEN absent : aucun ticket ni commentaire (l'échec du job reste le signal)."

      - name: Ticket « Sentinelle » (dépôt privé)
        if: always() && env.TICKETS_PRIVES == 'true'
        uses: actions/github-script@v9
        env:
          OUTCOME: ${{ steps.run.outcome }}
          FULL: ${{ env.FULL }}
        with:
          github-token: ${{ secrets.SENTINELLE_TOKEN }}
          script: |
            const fs = require("fs");
            const depot = { owner: "Qlpha-png", repo: "cryptoreflex-sentinelle" };
            const report = fs.existsSync("sentinelle-report.md") ? fs.readFileSync("sentinelle-report.md", "utf8") : "(rapport absent)";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failed = process.env.OUTCOME === "failure";
            const defects = report.split("\n").filter((l) => l.startsWith("- ❌")).sort().join("\n");
            const { data: open } = await github.rest.issues.listForRepo({ ...depot, state: "open", labels: "sentinelle", per_page: 10 });
            const issue = open[0];
            if (failed) {
              const body = `${report}\n\n[Voir l'exécution](${runUrl})`;
              if (!issue) {
                await github.rest.issues.create({ ...depot, title: "[Sentinelle] défauts détectés sur cryptoreflex.fr", body, labels: ["sentinelle"] });
                return;
              }
              // une seule alerte par ensemble de défauts identique (pas un commentaire par heure)
              const { data: comments } = await github.rest.issues.listComments({ ...depot, issue_number: issue.number, per_page: 100 });
              const lastBody = comments.length ? comments[comments.length - 1].body : issue.body;
              const lastDefects = (lastBody || "").split("\n").filter((l) => l.startsWith("- ❌")).sort().join("\n");
              if (lastDefects !== defects) await github.rest.issues.createComment({ ...depot, issue_number: issue.number, body });
            } else if (issue) {
              // Un contrôle LÉGER ne ferme le ticket que si tous les défauts ouverts relèvent de ce qu'il vérifie
              // (constaté le 05/10/2026 : un contrôle léger avait fermé un ticket de défauts des plans du site).
              const { data: comments } = await github.rest.issues.listComments({ ...depot, issue_number: issue.number, per_page: 100 });
              const lastBody = comments.length ? comments[comments.length - 1].body : issue.body;
              const openDefects = (lastBody || "").split("\n").filter((l) => l.startsWith("- ❌"));
              // « quota » volontairement absent : juste après minuit UTC le compteur du jour repart de zéro et un
              // contrôle léger verrait du vert à tort ; seul le contrôle complet (7 h 35) ferme un défaut de quota.
              const quickAreas = /^- ❌ \[(pages|chiffres|fraîcheur|prix|robots|jeu)\]/;
              const canClose = process.env.FULL === "true" || openDefects.every((l) => quickAreas.test(l));
              if (canClose) {
                await github.rest.issues.createComment({ ...depot, issue_number: issue.number, body: `✅ Tout est revenu au vert.\n\n${report}\n\n[Voir l'exécution](${runUrl})` });
                await github.rest.issues.update({ ...depot, issue_number: issue.number, state: "closed" });
              }
            }

      # 08/10/2026 (lot Z1, architecture 0 € § 6.2) : registre des 51 familles (data/fraicheur/registre.json), contrôle
      # complet seulement.
      #  - une famille ❌ → un ticket « [Fraîcheur] n° X — famille » (titre stable = dédoublonnage : jamais deux tickets
      #    ouverts pour la même famille) ; fermé automatiquement quand la famille repasse ✅ ou ⚠️ ;
      #  - le dimanche (ou si le dernier date de plus de 8 jours) → ticket « état des 51 familles », lisible sans rien
      #    ouvrir ; le précédent est fermé.
      # Reprise Z1 : PAS de continue-on-error. Une famille ❌ n'a pas d'autre signal que son ticket : si cette étape
      # échoue (jeton, API GitHub, exception), le job doit passer au rouge pour que GitHub envoie le courriel d'échec.
      - name: Tickets « Fraîcheur » (dépôt privé)
        if: always() && env.TICKETS_PRIVES == 'true' && env.FULL == 'true' && hashFiles('fraicheur-etat.json') != ''
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.SENTINELLE_TOKEN }}
          script: |
            const fs = require("fs");
            const depot = { owner: "Qlpha-png", repo: "cryptoreflex-sentinelle" };
            const etat = JSON.parse(fs.readFileSync("fraicheur-etat.json", "utf8"));
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ouverts = await github.paginate(github.rest.issues.listForRepo, { ...depot, state: "open", labels: "fraicheur", per_page: 100 });
            const titres = new Set(etat.tickets.map((t) => t.titre));
            let crees = 0, fermes = 0;
            for (const t of etat.tickets) {
              if (ouverts.some((i) => i.title === t.titre)) continue;
              await github.rest.issues.create({ ...depot, title: t.titre, body: `${t.corps}\n\n[Voir l'exécution](${runUrl})`, labels: ["fraicheur"] });
              crees++;
            }
            for (const i of ouverts) {
              if (!i.title.startsWith("[Fraîcheur] n° ") || titres.has(i.title)) continue;
              const r = etat.resultats.find((x) => i.title === `[Fraîcheur] n° ${x.id} — ${x.famille}`);
              await github.rest.issues.createComment({ ...depot, issue_number: i.number, body: `${r ? `${r.icone} ${r.msg}` : "Famille absente du registre."}\n\nFermé automatiquement par la sentinelle complète.\n\n[Voir l'exécution](${runUrl})` });
              await github.rest.issues.update({ ...depot, issue_number: i.number, state: "closed" });
              fermes++;
            }
            // ticket hebdomadaire « état des 51 familles »
            const { data: hebdos } = await github.rest.issues.listForRepo({ ...depot, state: "all", labels: "fraicheur-hebdo", sort: "created", direction: "desc", per_page: 5 });
            const dernier = hebdos[0];
            const ageJ = dernier ? (Date.now() - Date.parse(dernier.created_at)) / 86400e3 : Infinity;
            const dimanche = new Date().getUTCDay() === 0;
            if ((dimanche && ageJ > 6) || ageJ > 8) {
              const corps = fs.existsSync("fraicheur-hebdo.md") ? fs.readFileSync("fraicheur-hebdo.md", "utf8") : "(rapport absent)";
              const jour = new Date().toLocaleDateString("fr-FR", { timeZone: "Europe/Paris" });
              await github.rest.issues.create({ ...depot, title: `[Fraîcheur] état des 51 familles — ${jour}`, body: `${corps}\n[Voir l'exécution](${runUrl})`, labels: ["fraicheur-hebdo"] });
              for (const h of hebdos.filter((x) => x.state === "open")) await github.rest.issues.update({ ...depot, issue_number: h.number, state: "closed" });
            }
            core.info(`tickets fraîcheur : ${crees} créé(s), ${fermes} fermé(s)`);

      # 05/10/2026 (Kev : « un truc sans jeton et sans devoir que je l'actualise ») : réparations SANS IA, décidées par
      # scripts/sentinelle.mjs (sentinelle-repairs.json) avec garde-fous anti-boucle :
      #  - publication du jour ratée ou incomplète (actus périmées, moins de 5 analyses) → relancée (elle ne recrée que ce qui
      #    manque), au plus 3 passages par jour (hors passages « filet » de l'horloge Vercel) et jamais pendant qu'une autre tourne ;
      #  - orchestrateur quotidien sans passage depuis plus de 27 h → lancement de secours, au plus une fois toutes les 20 h ;
      #  - autre robot GitHub en échec → une seule nouvelle tentative des étapes en échec.
      # 07/10/2026 : les relances gardent le jeton du dépôt public ; le détail va dans sentinelle-reparations.md, publié
      # seulement dans le ticket privé (jamais dans le journal ni le résumé du job, qui sont publics).
      - name: Réparations automatiques (sans IA)
        if: always()
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            if (!fs.existsSync("sentinelle-repairs.json")) return core.info("pas de décision de réparation");
            const R = JSON.parse(fs.readFileSync("sentinelle-repairs.json", "utf8"));
            const runsOf = async (wf) => (await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: wf, per_page: 20 })).data.workflow_runs;
            const today = new Date().toISOString().slice(0, 10), done = [];
            if (R.dailyContent) {
              const runs = await runsOf("daily-content.yml");
              const busy = runs.some((r) => r.status !== "completed");
              // les passages « filet » de l'horloge Vercel (qui ne font rien si la publication a réussi) ne comptent pas
              const n = runs.filter((r) => r.created_at.startsWith(today) && !/filet/i.test(r.display_title || "")).length;
              if (busy) { /* publication du jour déjà en cours : rien à relancer (pas de commentaire, comme avant) */ }
              else if (n >= 3) done.push(`publication du jour NON relancée (${R.dailyContent}) : déjà ${n} passages aujourd'hui, intervention humaine nécessaire`);
              else { await github.rest.actions.createWorkflowDispatch({ ...context.repo, workflow_id: "daily-content.yml", ref: "main" }); done.push(`publication du jour relancée (${R.dailyContent})`); }
            }
            if (R.orchestrator) {
              const runs = await runsOf("coolify-crons.yml");
              if (runs.some((r) => Date.now() - Date.parse(r.created_at) < 20 * 3600e3)) { /* secours déjà lancé il y a moins de 20 h */ }
              else { await github.rest.actions.createWorkflowDispatch({ ...context.repo, workflow_id: "coolify-crons.yml", ref: "main", inputs: { job: "daily-orchestrator" } }); done.push(`orchestrateur quotidien relancé en secours (${R.orchestrator})`); }
            }
            for (const r of R.rerun || []) {
              try { await github.rest.actions.reRunWorkflowFailedJobs({ ...context.repo, run_id: r.id }); done.push(`« ${r.name} » : nouvelle tentative lancée`); }
              catch (e) { done.push(`« ${r.name} » : nouvelle tentative impossible (${e.message})`); }
            }
            if (!done.length) return core.info("rien à réparer");
            fs.writeFileSync("sentinelle-reparations.md", done.map((d) => "- " + d).join("\n") + "\n");
            core.info("décisions de réparation consignées pour le ticket privé");

      - name: Ticket « Sentinelle » — réparations (dépôt privé)
        if: always() && env.TICKETS_PRIVES == 'true' && hashFiles('sentinelle-reparations.md') != ''
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.SENTINELLE_TOKEN }}
          script: |
            const fs = require("fs");
            const depot = { owner: "Qlpha-png", repo: "cryptoreflex-sentinelle" };
            const liste = fs.readFileSync("sentinelle-reparations.md", "utf8").trim();
            const { data: open } = await github.rest.issues.listForRepo({ ...depot, state: "open", labels: "sentinelle", per_page: 5 });
            if (open[0]) await github.rest.issues.createComment({ ...depot, issue_number: open[0].number, body: `🔧 Réparations automatiques (sans IA) :\n\n${liste}` });

      # 05/10/2026 : 13 tickets d'échec de robots restaient ouverts depuis des mois (jamais fermés, donc plus lus). Ménage à
      # chaque passage : un ticket est fermé dès que son robot a réussi APRÈS son ouverture, et les doublons d'un même robot
      # sont regroupés dans le plus récent. 07/10/2026 : tickets dans le dépôt privé ; passages lus dans le dépôt public.
      - name: Ménage des tickets des robots (dépôt privé)
        if: always() && env.TICKETS_PRIVES == 'true'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.SENTINELLE_TOKEN }}
          script: |
            const depot = { owner: "Qlpha-png", repo: "cryptoreflex-sentinelle" };
            const ROBOTS = [["[daily-content]", "daily-content.yml"], ["[weekly-blog]", "weekly-blog.yml"], ["[weekly-events]", "weekly-events.yml"], ["[health-check]", "health-check.yml"], ["[stale-content]", "freshness-check.yml"]];
            const { data: open } = await github.rest.issues.listForRepo({ ...depot, state: "open", per_page: 100 });
            let fermes = 0;
            for (const [prefix, wf] of ROBOTS) {
              const mine = open.filter((i) => !i.pull_request && i.title.startsWith(prefix)).sort((x, y) => Date.parse(y.created_at) - Date.parse(x.created_at));
              if (!mine.length) continue;
              const { data } = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: wf, status: "success", per_page: 1 });
              const ok = data.workflow_runs[0];
              for (const [k, i] of mine.entries()) {
                let msg = null;
                if (ok && Date.parse(ok.created_at) > Date.parse(i.created_at)) msg = `✅ Fermé automatiquement : le robot \`${wf}\` a réussi depuis l'ouverture de ce ticket (${ok.created_at.slice(0, 16).replace("T", " ")} UTC, ${ok.html_url}).`;
                else if (k > 0) msg = `Regroupé dans #${mine[0].number} (même robot, ticket plus récent).`;
                if (!msg) continue;
                await github.rest.issues.createComment({ ...depot, issue_number: i.number, body: msg });
                await github.rest.issues.update({ ...depot, issue_number: i.number, state: "closed" });
                fermes++;
              }
            }
            core.info(`ménage des tickets : ${fermes} fermé(s)`);

      - name: Échec si défaut (e-mail GitHub)
        if: steps.run.outcome == 'failure'
        run: |
          echo "La sentinelle a trouvé des défauts : voir le ticket « Sentinelle »."
          exit 1
