# Calendrier officiel (Fed, BCE, halving) — robot hebdomadaire R7 (lot fraîcheur A, 08/10/2026, audit n° 34 : réunion du 29 avril affichée au
# 6 mai, juillet / octobre / décembre absents, badge « automatique » sans aucun robot).
#
# Lit https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm (scripts/refresh-fomc.mjs), réécrit SEULEMENT le bloc
# <fomc-auto> de lib/events-seed.ts (entrées « FOMC ») et l'extrait de référence tests/fixtures/fomc/reference.html, lance
# les tests, puis commite « chore(events): FOMC ». Rien n'est commité si les réunions n'ont pas changé.
# ÉCHEC (rouge) si la page est injoignable, si sa structure a changé ou si elle donne moins de 8 réunions pour l'année :
# le calendrier du site reste alors tel quel, et la sentinelle voit l'échec (contrôle des robots + cadence de 8,5 jours).
name: Calendrier officiel (Fed, BCE, halving)

# Lancé par l'horloge Vercel (lib/gardien.ts, /api/cron/gardien/refresh-fomc, lundi 06 h 20 UTC) ; l'horaire ci-dessous
# reste comme filet (doublon sans danger : commit seulement si le calendrier change, groupe de concurrence). Premier passage :
# à la fusion (push qui modifie le robot), pour que la sentinelle ne le voie pas « jamais lancé ».
on:
  schedule:
    - cron: "20 6 * * 1" # filet de l'horloge Vercel
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/refresh-fomc.mjs
      - scripts/lib/fomc.mjs
      - scripts/refresh-calendrier-officiel.mjs
      - scripts/lib/bce-calendrier.mjs
      - scripts/lib/halving.mjs
      - .github/workflows/refresh-fomc.yml

permissions:
  contents: write

concurrency:
  group: refresh-fomc
  cancel-in-progress: false

jobs:
  fomc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Lire le calendrier de la Fed
        id: fomc
        run: node scripts/refresh-fomc.mjs

      # 10/10/2026 (lot Z4, R7 étendu) : réunions de politique monétaire de la BCE et prochain halving en fourchette
      # (mempool.space, recoupé avec blockstream.info) → data/calendrier-officiel.json + extrait tests/fixtures/bce/reference.html.
      # Ne tourne qu'après une lecture réussie de la Fed : la date « Fed, BCE : relevé automatique » est celle de ce passage.
      # Une partie en échec garde ses anciennes données (ROUGE à la fin du job), les autres sont publiées.
      - name: Lire la BCE et le halving
        id: cal
        continue-on-error: true
        run: node scripts/refresh-calendrier-officiel.mjs

      - name: Dépendances (tests)
        if: steps.fomc.outputs.changed == 'true' || steps.cal.outputs.changed == 'true'
        run: npm ci --no-audit --no-fund

      # Bloquant avant tout commit : le seed doit être la traduction exacte de la page lue, et le projet doit compiler.
      - name: Tests du calendrier
        if: steps.fomc.outputs.changed == 'true' || steps.cal.outputs.changed == 'true'
        run: |
          npx vitest run tests/lib/events-fomc.test.ts tests/lib/calendrier-officiel.test.ts
          npx tsc --noEmit -p .

      - name: Commit + push (avec reprise anti-course)
        if: steps.fomc.outputs.changed == 'true' || steps.cal.outputs.changed == 'true'
        run: |
          git add lib/events-seed.ts tests/fixtures/fomc/reference.html data/calendrier-officiel.json tests/fixtures/bce/reference.html
          if git diff --staged --quiet; then
            echo "Aucun fichier modifié." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "Cryptoreflex Bot"
          git config user.email "bot@cryptoreflex.fr"
          git commit -m "chore(events): FOMC, BCE et halving ($(date -u +%Y-%m-%d))" \
            -m "Calendriers officiels de la Fed et de la BCE, hauteur de bloc (mempool.space) relus par .github/workflows/refresh-fomc.yml" \
            -m "" \
            -m "Co-Authored-By: Cryptoreflex Bot <bot@cryptoreflex.fr>"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Calendrier FOMC publié (commit $(git rev-parse --short HEAD))." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push rejeté, rebase puis nouvel essai ($i / 3)…"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; break; }
            sleep 2
          done
          echo "## ❌ Push du calendrier FOMC impossible après 3 essais" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Échec si la BCE ou le halving n'ont pas pu être relus
        if: steps.cal.outcome == 'failure'
        run: |
          echo "Calendrier BCE ou halving : lecture refusée, anciennes données gardées (voir le résumé)."
          exit 1
