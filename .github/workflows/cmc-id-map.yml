name: Table CoinMarketCap des fiches (chaque mois)

# 10/10/2026 (reprise du lot Z3, I5) — demande de Kev : « tout ce qui n'est pas automatisé doit l'être ».
# Reconstruit data/cmc-id-map.json (id de fiche → id CoinMarketCap) lue par le robot des fiches R2 :
# même symbole ET nom compatible ET prix CMC à ± 5 % du prix de la fiche en base (scripts/lib/cmc-appariement.mjs).
# Le 1er du mois à 08:30 UTC, juste après le passage de 08:00 de R2 (prix de référence de moins de 6 h).
# Budget : /v1/key/info (0 crédit) puis /v1/cryptocurrency/map + cotations des seuls candidats (≈ 8 crédits par mois) ;
# refus si le frein du mois est actif ou s'il reste moins de 300 crédits (scripts/lib/budget-mois.mjs).
# Garde-fou : jamais de table à moins de 90 % des correspondances actuelles (robot rouge, la table reste en place).
# Clé CMC : elle reste sur Vercel. Le robot demande les lignes CMC à la route du site /api/cron/cmc-lignes (CRON_SECRET),
# puis construit la table ici avec les prix de référence de la base (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY) ; aucun
# secret n'est affiché.
on:
  schedule:
    - cron: "30 8 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cmc-id-map
  cancel-in-progress: false

jobs:
  table:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Lignes CoinMarketCap (route du site, clé gardée sur Vercel)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          HTTP=$(curl -sS --max-time 200 -o /tmp/cmc-lignes.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" "https://www.cryptoreflex.fr/api/cron/cmc-lignes" || echo 000)
          if [ "$HTTP" != "200" ]; then
            ERR=$(node -e "try{const j=require('/tmp/cmc-lignes.json');console.log(j.error||'')}catch{console.log('')}")
            echo "## ❌ Route /api/cron/cmc-lignes : HTTP $HTTP ${ERR}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node -e "const j=require('/tmp/cmc-lignes.json');if(!Array.isArray(j.data)||!j.data.length){console.error('réponse sans lignes');process.exit(1)}console.log(j.source+' : '+j.candidats+' candidats, '+j.data.length+' lignes, '+j.fiches+' fiches')"

      - name: Reconstruction de la table (symbole + nom + prix à ± 5 %)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/construire-cmc-id-map.mjs --liste /tmp/cmc-lignes.json --ecrire | tee /tmp/cmc-map.log
          {
            echo "## Table CoinMarketCap des fiches"
            echo ""
            echo '```'
            cat /tmp/cmc-map.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit de la table (avec reprise anti-course)
        run: |
          git add data/cmc-id-map.json
          if git diff --staged --quiet; then
            echo "Table inchangée." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "Cryptoreflex Bot"
          git config user.email "bot@cryptoreflex.fr"
          git commit -m "chore(cmc): table CoinMarketCap des fiches ($(date -u +%Y-%m))" \
            -m "Robot mensuel .github/workflows/cmc-id-map.yml" \
            -m "" \
            -m "Co-Authored-By: Cryptoreflex Bot <bot@cryptoreflex.fr>"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Table publiée (commit $(git rev-parse --short HEAD))." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push rejeté, rebase puis nouvel essai ($i / 3)…"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; break; }
            sleep 2
          done
          echo "## ❌ Push de la table impossible après 3 essais" >> "$GITHUB_STEP_SUMMARY"
          exit 1
