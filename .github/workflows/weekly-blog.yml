name: Weekly long-form blog generator

# Cron samedi 8h UTC = 9h-10h Paris (selon DST). Manuel via "Run workflow" possible.
on:
  # RÉACTIVÉ le 02/10/2026 (Kev : « fais fonctionner tous les trucs automatiques », clé Anthropic conservée).
  # (Coupé de juin à octobre 2026 pendant la démonétisation.)
  # 07/10/2026 : lancé par l'horloge Vercel (lib/gardien.ts) ; l'horaire ci-dessous reste comme filet. Un second passage
  # publierait un SECOND article (le générateur prend le sujet suivant du catalogue) : garde anti-doublon ci-dessous.
  schedule:
    - cron: "0 8 * * 6" # filet de l'horloge Vercel
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Essai : générer l'article sans le publier (joint au run pour relecture)"
        type: boolean
        default: false
      force:
        description: "Publier même si un article de la semaine est déjà sorti ces 5 derniers jours"
        type: boolean
        default: false

# Permissions write requise pour commit + push automatique sur main.
# Tickets : dépôt PRIVÉ Qlpha-png/cryptoreflex-sentinelle (secret SENTINELLE_TOKEN), plus aucun ticket dans ce dépôt.
permissions:
  contents: write

# Concurrency : 1 seul run à la fois (évite race conditions sur git push).
concurrency:
  group: weekly-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TICKETS_PRIVES: ${{ secrets.SENTINELLE_TOKEN != '' }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      # Pas de npm ci : le script est .mjs zéro-dépendance (fetch + fs natifs Node 20+).

      # 07/10/2026 : horloge Vercel + filet GitHub = jusqu'à 2 lancements le samedi ; un article déjà publié depuis moins
      # de 5 jours → rien à générer (sauf essai ou « force »).
      - name: Garde anti-doublon (article de la semaine déjà publié ?)
        id: garde
        if: inputs.dry_run != true && inputs.dry_run != 'true' && inputs.force != true && inputs.force != 'true'
        run: |
          if git log HEAD --since="5 days ago" --grep="^feat(content): weekly long-form article" --format=%h | grep -q .; then
            echo "deja=true" >> "$GITHUB_OUTPUT"
            echo "Un article de la semaine est déjà publié depuis moins de 5 jours : rien à générer."
          else
            echo "Aucun article de la semaine sur les 5 derniers jours : génération."
          fi

      - name: Generate weekly long-form article
        id: gen
        if: steps.garde.outputs.deja != 'true'
        run: node scripts/generate-weekly-article.mjs
        env:
          NODE_ENV: production
          # ANTHROPIC_API_KEY OBLIGATOIRE — sinon le script exit 0 sans rien faire.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Override du modèle si besoin (default : anthropic/claude-3.5-sonnet)
          # LLM_MODEL: openai/gpt-4o

      # 05/10/2026 : l'article de la semaine partait sans le garde-fou fiscal que passent les actus. Même contrôle : décimales
      # au format français, article fautif écarté (il ne sera pas publié, le ticket d'échec habituel s'ouvre s'il ne reste rien).
      - name: Contrôle de l'article (format + garde-fou fiscal)
        id: gate
        if: steps.garde.outputs.deja != 'true'
        run: node scripts/content-gate.mjs --dirs=content/articles

      - name: Detect changes
        id: changes
        run: |
          git add content/articles
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Aucun nouvel article à committer."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            count=$(git diff --staged --name-only | wc -l)
            echo "$count nouvel(s) article(s) détecté(s) :"
            git diff --staged --name-only
            echo "files_count=$count" >> $GITHUB_OUTPUT
            # Récupère le slug pour le message de commit
            SLUG=$(git diff --staged --name-only | head -1 | sed 's|content/articles/||' | sed 's|.mdx$||')
            echo "slug=$SLUG" >> $GITHUB_OUTPUT
          fi

      # Mode essai : l'article est joint au run (onglet Artifacts) et rien n'est publié.
      - name: Upload article (dry run)
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: weekly-article-dry-run
          path: content/articles/${{ steps.changes.outputs.slug }}.mdx
          retention-days: 7

      - name: Commit + push (with rebase loop anti-race)
        id: commit_push
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run != true
        run: |
          git config user.name "Cryptoreflex Bot"
          git config user.email "bot@cryptoreflex.fr"
          DATE_UTC=$(date -u +%Y-%m-%d)
          git commit -m "feat(content): weekly long-form article — ${{ steps.changes.outputs.slug }} ($DATE_UTC)" \
            -m "Generated by .github/workflows/weekly-blog.yml" \
            -m "Files added: ${{ steps.changes.outputs.files_count }}" \
            -m "" \
            -m "Co-Authored-By: Cryptoreflex Bot <bot@cryptoreflex.fr>"

          # Anti-race-condition cf. daily-content.yml (race observee 2026-05-06).
          for i in 1 2 3; do
            if git push origin main; then
              echo "Push reussi (tentative $i)"
              exit 0
            fi
            echo "Push rejete, rebase + retry (tentative $i / 3)..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep 2
          done
          exit 1

      - name: Wait for Vercel deploy (90s)
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run != true
        run: sleep 90

      - name: Ping Google + Bing (sitemap update)
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run != true
        continue-on-error: true
        run: node scripts/ping-search-engines.mjs

      - name: Job summary
        if: always()
        run: |
          echo "## Cryptoreflex weekly-blog run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Fix audit 2026-05-06 : on lit la conclusion REELLE du step
          # commit_push, pas seulement has_changes (cf. daily-content.yml).
          if [ "${{ steps.garde.outputs.deja }}" = "true" ]; then
            echo "ℹ️ Article de la semaine déjà publié depuis moins de 5 jours : rien généré (garde anti-doublon)." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "🧪 Essai : article \`${{ steps.changes.outputs.slug }}\` généré, NON publié (voir Artifacts)." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.changes.outputs.has_changes }}" = "false" ]; then
            echo "ℹ️ Aucun nouvel article (validation LLM en échec, ANTHROPIC_API_KEY absente, ou catalogue épuisé)." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.commit_push.conclusion }}" = "success" ]; then
            echo "✅ Nouvel article publié : **${{ steps.changes.outputs.slug }}**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- Coolify/Vercel redeploy déclenché automatiquement (~90s)" >> $GITHUB_STEP_SUMMARY
            echo "- Google + Bing pingés via /sitemap-news.xml" >> $GITHUB_STEP_SUMMARY
            echo "- URL : https://www.cryptoreflex.fr/blog/${{ steps.changes.outputs.slug }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Push échoué** (article \`${{ steps.changes.outputs.slug }}\` généré localement mais non pushé)." >> $GITHUB_STEP_SUMMARY
            echo "→ Voir le log du step \`Commit + push\` pour la cause exacte." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Site](https://www.cryptoreflex.fr) — [Sitemap News](https://www.cryptoreflex.fr/sitemap-news.xml)" >> $GITHUB_STEP_SUMMARY

      - name: Tickets privés non configurés
        if: failure() && env.TICKETS_PRIVES != 'true'
        run: |
          echo "Secret SENTINELLE_TOKEN absent : aucun ticket ni commentaire (l'échec du job reste le signal)."

      - name: Notify on failure (open GitHub issue) (dépôt privé)
        if: failure() && env.TICKETS_PRIVES == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.SENTINELLE_TOKEN }}
          script: |
            const depot = { owner: "Qlpha-png", repo: "cryptoreflex-sentinelle" };
            const date = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              ...depot,
              title: `[weekly-blog] Échec génération — ${date}`,
              body: [
                `Le workflow \`weekly-blog.yml\` a échoué le ${date}.`,
                ``,
                `**Action** : ouvrir [le run GitHub Actions](${runUrl}) pour voir les logs.`,
                ``,
                `Causes probables :`,
                `- Catalogue \`lib/seo-keyword-targets.ts\` épuisé (ajouter de nouveaux topics)`,
                `- Validation LLM en échec après retry (wordCount < 1500, H2 < 5, callout YMYL absent, ou < 2 internal links)`,
                `- Quota OpenRouter dépassé`,
                `- Modèle \`anthropic/claude-3.5-sonnet\` indisponible (try \`LLM_MODEL=openai/gpt-4o\`)`,
                ``,
                `_Issue auto-créée par .github/workflows/weekly-blog.yml_`,
              ].join("\n"),
              labels: ["bot", "weekly-blog", "needs-triage"],
            });
