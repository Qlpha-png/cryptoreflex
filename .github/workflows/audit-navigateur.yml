# Audit navigateur de nuit — cryptoreflex.fr en vrai navigateur (Playwright), en production.
# Étape 1 du « Pilote automatique » (plan du 05/10/2026) : ce que la sentinelle ne voit pas avec de simples requêtes.
#  - 19 parcours d'outils avec résultats attendus (calculateurs, convertisseur, Cerfa 2086, vérificateur MiCA…) ;
#  - listes déroulantes et menus : chaque choix doit être cliquable (rien ne le recouvre) ;
#  - pages fixes + exemples de chaque modèle, sur téléphone et ordinateur : erreurs JavaScript, requêtes en échec,
#    images cassées, débordements, textes cassés (NaN, undefined…).
# Un défaut : ticket « [Audit navigateur] » (label audit-navigateur), complété une seule fois par ensemble de défauts,
# fermé au retour au vert ; la routine Claude du matin le traite comme un ticket de la sentinelle.
# Aucun formulaire n'est envoyé, aucun e-mail : lecture seule.
name: Audit navigateur (nuit)

on:
  schedule:
    - cron: "10 3 * * *" # 5 h 10 à Paris, avant la publication des actus
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: audit-navigateur
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE: https://www.cryptoreflex.fr
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Dépendances + Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Parcours d'outils
        continue-on-error: true
        run: node scripts/audit-site/tools.mjs --base=$BASE --out=audit-nuit/tools

      - name: Listes déroulantes
        continue-on-error: true
        run: node scripts/audit-site/dropdowns.mjs --base=$BASE --out=audit-nuit/dropdowns.json

      - name: Navigateur réel (téléphone et ordinateur)
        continue-on-error: true
        run: node scripts/audit-site/browser.mjs --base=$BASE --out=audit-nuit/browser --conc=2

      - name: Rapport
        id: report
        continue-on-error: true
        run: node scripts/audit-site/report-nuit.mjs --dir=audit-nuit --out=audit-nuit-report.md

      - name: Captures et résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-navigateur
          path: |
            audit-nuit
            audit-nuit-report.md
          retention-days: 14

      - name: Ticket « Audit navigateur »
        if: always()
        uses: actions/github-script@v9
        env:
          OUTCOME: ${{ steps.report.outcome }}
        with:
          script: |
            const fs = require("fs");
            const report = fs.existsSync("audit-nuit-report.md") ? fs.readFileSync("audit-nuit-report.md", "utf8") : "(rapport absent)";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failed = process.env.OUTCOME === "failure";
            const defects = report.split("\n").filter((l) => l.startsWith("- ❌")).sort().join("\n");
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "audit-navigateur", per_page: 10 });
            const issue = open[0];
            if (failed) {
              const body = `${report}\n\n[Voir l'exécution et les captures](${runUrl})`;
              if (!issue) {
                await github.rest.issues.create({ ...context.repo, title: "[Audit navigateur] défauts détectés sur cryptoreflex.fr", body, labels: ["audit-navigateur"] });
                return;
              }
              const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: issue.number, per_page: 100 });
              const lastBody = comments.length ? comments[comments.length - 1].body : issue.body;
              const lastDefects = (lastBody || "").split("\n").filter((l) => l.startsWith("- ❌")).sort().join("\n");
              if (lastDefects !== defects) await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
            } else if (issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `✅ Tout est revenu au vert.\n\n${report}\n\n[Voir l'exécution](${runUrl})` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: "closed" });
            }
