# Audit navigateur de nuit — cryptoreflex.fr en vrai navigateur (Playwright), en production.
# Étape 1 du « Pilote automatique » (plan du 05/10/2026) : ce que la sentinelle ne voit pas avec de simples requêtes.
#  - 19 parcours d'outils avec résultats attendus (calculateurs, convertisseur, Cerfa 2086, vérificateur MiCA…) ;
#  - listes déroulantes et menus : chaque choix doit être cliquable (rien ne le recouvre) ;
#  - pages fixes + exemples de chaque modèle, sur téléphone et ordinateur : erreurs JavaScript, requêtes en échec,
#    images cassées, débordements, textes cassés (NaN, undefined…).
# Un défaut : ticket « [Audit navigateur] » (label audit-navigateur), complété une seule fois par ensemble de défauts,
# fermé au retour au vert ; la routine Claude du matin le traite comme un ticket de la sentinelle.
# Aucun formulaire n'est envoyé, aucun e-mail : lecture seule.
name: Audit navigateur (nuit)

# 07/10/2026 : lancé par l'horloge Vercel (lib/gardien.ts) ; l'horaire ci-dessous reste comme filet (un doublon est sans
# danger : lecture seule, groupe de concurrence, ticket complété une fois par ensemble de défauts). Tickets dans le dépôt
# PRIVÉ Qlpha-png/cryptoreflex-sentinelle (secret SENTINELLE_TOKEN).
on:
  schedule:
    - cron: "10 3 * * *" # 5 h 10 à Paris, avant la publication des actus (filet de l'horloge Vercel)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-navigateur
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE: https://www.cryptoreflex.fr
      TICKETS_PRIVES: ${{ secrets.SENTINELLE_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Dépendances + Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Parcours d'outils
        continue-on-error: true
        run: node scripts/audit-site/tools.mjs --base=$BASE --out=audit-nuit/tools

      - name: Listes déroulantes
        continue-on-error: true
        run: node scripts/audit-site/dropdowns.mjs --base=$BASE --out=audit-nuit/dropdowns.json

      - name: Navigateur réel (téléphone et ordinateur)
        continue-on-error: true
        run: node scripts/audit-site/browser.mjs --base=$BASE --out=audit-nuit/browser --conc=2

      - name: Rapport
        id: report
        continue-on-error: true
        run: node scripts/audit-site/report-nuit.mjs --dir=audit-nuit --out=audit-nuit-report.md

      - name: Captures et résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-navigateur
          path: |
            audit-nuit
            audit-nuit-report.md
          retention-days: 14

      - name: Tickets privés non configurés
        if: always() && env.TICKETS_PRIVES != 'true'
        run: |
          echo "Secret SENTINELLE_TOKEN absent : aucun ticket ni commentaire (l'échec du job reste le signal)."

      - name: Ticket « Audit navigateur » (dépôt privé)
        if: always() && env.TICKETS_PRIVES == 'true'
        uses: actions/github-script@v9
        env:
          OUTCOME: ${{ steps.report.outcome }}
        with:
          github-token: ${{ secrets.SENTINELLE_TOKEN }}
          script: |
            const fs = require("fs");
            const depot = { owner: "Qlpha-png", repo: "cryptoreflex-sentinelle" };
            const report = fs.existsSync("audit-nuit-report.md") ? fs.readFileSync("audit-nuit-report.md", "utf8") : "(rapport absent)";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failed = process.env.OUTCOME === "failure";
            const defects = report.split("\n").filter((l) => l.startsWith("- ❌")).sort().join("\n");
            const { data: open } = await github.rest.issues.listForRepo({ ...depot, state: "open", labels: "audit-navigateur", per_page: 10 });
            const issue = open[0];
            if (failed) {
              const body = `${report}\n\n[Voir l'exécution et les captures](${runUrl})`;
              if (!issue) {
                await github.rest.issues.create({ ...depot, title: "[Audit navigateur] défauts détectés sur cryptoreflex.fr", body, labels: ["audit-navigateur"] });
                return;
              }
              const { data: comments } = await github.rest.issues.listComments({ ...depot, issue_number: issue.number, per_page: 100 });
              const lastBody = comments.length ? comments[comments.length - 1].body : issue.body;
              const lastDefects = (lastBody || "").split("\n").filter((l) => l.startsWith("- ❌")).sort().join("\n");
              if (lastDefects !== defects) await github.rest.issues.createComment({ ...depot, issue_number: issue.number, body });
            } else if (issue) {
              await github.rest.issues.createComment({ ...depot, issue_number: issue.number, body: `✅ Tout est revenu au vert.\n\n${report}\n\n[Voir l'exécution](${runUrl})` });
              await github.rest.issues.update({ ...depot, issue_number: issue.number, state: "closed" });
            }

      # 07/10/2026 : sans tickets privés, rien ne signalait un défaut (le job restait vert) : le job échoue alors (e-mail
      # GitHub). Avec les tickets privés, comportement inchangé (le ticket est le signal, le job reste vert).
      - name: Échec si défaut et pas de ticket (e-mail GitHub)
        if: steps.report.outcome == 'failure' && env.TICKETS_PRIVES != 'true'
        run: |
          echo "L'audit navigateur a trouvé des défauts (tickets privés non configurés)."
          exit 1
