name: Daily content generator (news + TA)

# Actu du jour, TOUS LES JOURS à heure fixe.
# Cron 05:30 UTC = 07h30 Paris (été) / 06h30 (hiver).
# Pourquoi ce créneau : à 5h30 UTC toute la nuit US (clôture Wall Street) +
# la session asiatique sont passées → info du jour complète et fraîche ; et
# l'article est publié AVANT le pic de lecture matinal FR (7-9h), bon pour le
# SEO « freshness ». Minute décalée (30) pour éviter la congestion GitHub
# Actions du top d'heure (qui retarde les runs). Déploiement Vercel ~10 min
# après le push. Déclenchement manuel possible via "Run workflow".
on:
  # 2026-05-31 : 'schedule' natif GitHub retiré (il partait avec 2-5 h de retard,
  # publication vers 10-13h Paris au lieu du matin). Déclenchement désormais PRÉCIS
  # via cron-job.org → API workflow_dispatch, tous les jours à 06:30 Europe/Paris.
  # Si cron-job.org tombe, les monitors freshness-check + health-check alertent.
  # 07/10/2026 : cron-job.org lance toujours la publication à 04 h 30 UTC (constaté du 02 au 07/10/2026). Filet : l'horloge
  # Vercel (lib/gardien.ts, /api/cron/gardien/daily-content) lance ce workflow à 04 h 45 UTC avec « filet » ; il ne fait
  # alors RIEN si la publication du jour a déjà réussi (le générateur publie jusqu'à 3 nouvelles actus par passage : un
  # second passage complet doublerait les actus du jour). Sans « filet » (cron-job.org, sentinelle, lancement manuel) :
  # comportement inchangé.
  workflow_dispatch:
    inputs:
      filet:
        description: "Lancement de secours : ne rien faire si la publication du jour a déjà réussi"
        type: boolean
        default: false

# Nom du passage : les passages « filet » sont exclus du plafond de 3 relances par jour de la sentinelle.
run-name: ${{ (inputs.filet == true || inputs.filet == 'true') && 'Publication du jour (filet du gardien)' || 'Daily content generator (news + TA)' }}

# Permissions write requise pour commit + push automatique sur main.
# Tickets : dépôt PRIVÉ Qlpha-png/cryptoreflex-sentinelle (secret SENTINELLE_TOKEN), plus aucun ticket dans ce dépôt.
# `actions: read` : le filet lit les passages du jour.
permissions:
  contents: write
  actions: read

# Concurrency : 1 seul run à la fois (évite race conditions sur git push).
concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  filet:
    if: inputs.filet == true || inputs.filet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      deja: ${{ steps.lecture.outputs.deja }}
    steps:
      - name: Publication du jour déjà réussie ?
        id: lecture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow daily-content.yml --status success --created ">=$(date -u +%F)" --json databaseId --jq 'length')
          if [ "${n:-0}" -gt 0 ]; then
            echo "deja=true" >> "$GITHUB_OUTPUT"
            echo "Publication du jour déjà réussie : rien à faire."
          else
            echo "Aucune publication réussie aujourd'hui : lancement."
          fi

  generate:
    needs: filet
    # filet sauté (lancement normal) ou en panne : on publie (mieux vaut un doublon qu'aucune publication)
    if: ${{ !cancelled() && needs.filet.outputs.deja != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TICKETS_PRIVES: ${{ secrets.SENTINELLE_TOKEN != '' }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Fetch full history pour pouvoir détecter les conflits de merge éventuels
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      # Pas de npm ci : le script est .mjs zéro-dépendance (fetch + fs natifs Node 20+).
      # Si on ajoute des deps Node modules futures, dé-commenter :
      # - name: Install deps
      #   run: npm ci --omit=dev

      - name: Generate daily content (news + TA)
        id: gen
        run: node scripts/generate-daily-content.mjs
        env:
          NODE_ENV: production
          # REQUISE : clé API Anthropic pour le rewriter journaliste (Sonnet).
          # Si absente/KO, l'article est SAUTÉ (politique « que du pro » — plus
          # jamais de coquille vide publiée).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # GATE ANTI-RÉGRESSION FISCALE (juin 2026) — bloquant, AVANT commit/push.
      # Si le contenu généré réintroduit une fausse doctrine fiscale (swap
      # crypto→crypto / crypto→stablecoin imposable sans nuance, staking/airdrop
      # BNC à la réception sans prudence, fausses dates BOFiP, seuils inventés),
      # ce step échoue → le mauvais contenu n'est NI committé NI poussé.
      # Volontairement bloquant : pas de `|| true`, pas de `continue-on-error`.
      # --fiscal-only ne lance que la famille fiscale (ignore la dette historique
      # no-signal-achat-direct, sans affaiblir la règle fiscale). Script zéro-dépendance.
      # 05/10/2026 : un seul article fautif (ou un faux positif) bloquait toute la publication du jour. Le contrôle des contenus
      # (scripts/content-gate.mjs) met les décimales au format français, écarte un NOUVEL article fautif (fichier + image) et
      # publie les autres ; il reste bloquant si un article DÉJÀ publié est en faute.
      - name: Contrôle des contenus (format + garde-fou fiscal)
        id: gate
        run: node scripts/content-gate.mjs

      - name: Detect changes
        id: changes
        run: |
          git add content/news content/analyses-tech public/news-covers
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Aucun nouveau contenu à committer."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            count=$(git diff --staged --name-only | wc -l)
            echo "$count nouveaux fichiers détectés :"
            git diff --staged --name-only
            echo "files_count=$count" >> $GITHUB_OUTPUT
          fi

      - name: Commit + push (with rebase loop anti-race)
        id: commit_push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "Cryptoreflex Bot"
          git config user.email "bot@cryptoreflex.fr"
          DATE_UTC=$(date -u +%Y-%m-%d)
          git commit -m "chore(content): daily auto-generate news + TA ($DATE_UTC)" \
            -m "Generated by .github/workflows/daily-content.yml" \
            -m "Files added: ${{ steps.changes.outputs.files_count }}" \
            -m "" \
            -m "Co-Authored-By: Cryptoreflex Bot <bot@cryptoreflex.fr>"

          # Anti-race-condition : si main a bougé pendant la generation
          # (push humain en parallele), on rebase + retry up to 3x.
          # Documente : la race s'est produite le 2026-05-06 (run 25435215740)
          # quand 4 commits humains ont ete pousses pendant la generation.
          for i in 1 2 3; do
            if git push origin main; then
              echo "Push reussi (tentative $i)"
              exit 0
            fi
            echo "Push rejete, rebase + retry (tentative $i / 3)..."
            git fetch origin main
            git rebase origin/main || {
              echo "Rebase a echoue (conflit) - abort"
              git rebase --abort
              exit 1
            }
            sleep 2
          done
          echo "Push echoue apres 3 tentatives - probablement conflit persistant"
          exit 1

      - name: Wait for Vercel deploy (90s)
        if: steps.changes.outputs.has_changes == 'true'
        run: sleep 90

      - name: Ping Google + Bing (sitemap update)
        if: steps.changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: node scripts/ping-search-engines.mjs

      # Audit 2026-10-02 : la génération des news pouvait échouer en silence (crédit Anthropic
      # épuisé = 0 news du 14/07 au 02/10/2026, run « vert »). Les analyses techniques sont déjà
      # committées à ce stade ; ce step fait échouer le run (→ issue « Notify on failure »)
      # si aucune news n'a été créée alors que des tentatives ont échoué.
      - name: Échec si aucune news générée
        if: steps.gen.outputs.news_created == '0' && steps.gen.outputs.news_errors != '0'
        run: |
          echo "::error::0 news créée, ${{ steps.gen.outputs.news_errors }} échec(s) : vérifier le secret ANTHROPIC_API_KEY (clé et crédit)."
          exit 1

      - name: Job summary
        if: always()
        run: |
          echo "## Cryptoreflex daily-content run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Fix audit 2026-05-06 : on lit la conclusion REELLE du step
          # commit_push, pas seulement has_changes. Avant : le summary
          # affichait \"X fichiers committes\" meme quand le push echouait
          # (run 25435215740) - source de confusion en debug.
          if [ "${{ steps.changes.outputs.has_changes }}" = "false" ]; then
            echo "ℹ️  Aucun nouveau contenu (fichiers déjà à jour ou sources RSS down)." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.commit_push.conclusion }}" = "success" ]; then
            echo "✅ **${{ steps.changes.outputs.files_count }} nouveaux fichiers committés et pushés**" >> $GITHUB_STEP_SUMMARY
            echo "→ Coolify/Vercel redeploy déclenché automatiquement (~90s)" >> $GITHUB_STEP_SUMMARY
            echo "→ Google + Bing pingés via /sitemap-news.xml" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Push échoué** (${{ steps.changes.outputs.files_count }} fichiers générés localement mais non pushés)." >> $GITHUB_STEP_SUMMARY
            echo "→ Voir le log du step \`Commit + push\` pour la cause exacte." >> $GITHUB_STEP_SUMMARY
            echo "→ Causes typiques : non-fast-forward (race), token expiré, branch protection." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Site](https://www.cryptoreflex.fr) — [Sitemap News](https://www.cryptoreflex.fr/sitemap-news.xml)" >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Notification automatique en cas d'échec : ouvre une issue GitHub avec
      # contexte (run URL, labels). Pas de spam : un fail unique = 1 issue.
      # ----------------------------------------------------------------------
      # Ticket UNIQUE (05/10/2026) : un échec complète le ticket ouvert au lieu d'en créer un par jour (13 tickets jamais
      # fermés) ; un article écarté par le garde-fou y est signalé ; le premier passage vert le ferme.
      - name: Tickets privés non configurés
        if: always() && env.TICKETS_PRIVES != 'true'
        run: |
          echo "Secret SENTINELLE_TOKEN absent : aucun ticket ni commentaire (l'échec du job reste le signal)."

      - name: Ticket (échec, article écarté, retour au vert) — dépôt privé
        if: always() && env.TICKETS_PRIVES == 'true'
        uses: actions/github-script@v9
        env:
          DROPPED: ${{ steps.gate.outputs.dropped }}
          DROPPED_LIST: ${{ steps.gate.outputs.dropped_list }}
          FAILED: ${{ job.status == 'failure' }}
        with:
          github-token: ${{ secrets.SENTINELLE_TOKEN }}
          script: |
            const depot = { owner: "Qlpha-png", repo: "cryptoreflex-sentinelle" };
            const date = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...depot, state: "open", labels: "auto-content", per_page: 50 });
            const mine = open.filter((i) => i.title.startsWith("[daily-content]"));
            const failed = process.env.FAILED === "true", dropped = Number(process.env.DROPPED || 0);
            if (!failed && dropped === 0) {
              for (const i of mine) {
                await github.rest.issues.createComment({ ...depot, issue_number: i.number, body: `✅ Publication du ${date} réussie : retour au vert. [Voir l'exécution](${runUrl})` });
                await github.rest.issues.update({ ...depot, issue_number: i.number, state: "closed" });
              }
              return;
            }
            const lines = failed
              ? [`❌ Échec de la publication du ${date}.`, `**Run** : ${runUrl}`]
              : [`⚠️ Publication du ${date} faite, mais ${dropped} article(s) écarté(s) par le garde-fou fiscal (formulation à revoir) :`, ...String(process.env.DROPPED_LIST || "").split(" ").filter(Boolean).map((f) => `- \`${f}\``), `**Run** : ${runUrl}`];
            if (mine.length) {
              await github.rest.issues.createComment({ ...depot, issue_number: mine[0].number, body: lines.join("\n") });
              return;
            }
            if (!failed) {
              await github.rest.issues.create({ ...depot, title: `[daily-content] article(s) écarté(s) - ${date}`, body: lines.join("\n"), labels: ["auto-content"] });
              return;
            }
            await github.rest.issues.create({
              ...depot,
              title: `[daily-content] FAIL - ${date}`,
              body: [
                `Le workflow \`daily-content\` a échoué.`,
                ``,
                `**Run** : ${runUrl}`,
                `**Date** : ${date}`,
                ``,
                `### Causes possibles`,
                `- Sources RSS (Cointelegraph, etc.) down ou rate-limit`,
                `- Quota OpenRouter dépassé (rewriter LLM)`,
                `- Conflit de merge sur \`content/news\` ou \`content/analyses-tech\``,
                `- Échec push sur main (token expiré ?)`,
                ``,
                `### À faire`,
                `1. Ouvrir le run et lire les logs étape par étape`,
                `2. Si rewriter HS : check \`ANTHROPIC_API_KEY\` (secret + quota)`,
                `3. Re-run manuellement (workflow_dispatch) après fix`,
                ``,
                `_Issue créée automatiquement par \`.github/workflows/daily-content.yml\`_`,
              ].join("\n"),
              labels: ["bug", "auto-content", "urgent"],
            });
